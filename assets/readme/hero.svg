<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Cerna Pensamento — Editorial Digital Magazine</title>
  <desc id="hero-desc">Bilingual Galician and Spanish cultural journal platform built with Next.js 16, React 19, Supabase, TipTap 3, and Tailwind CSS v4.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="65%" stop-color="#1A1917" />
      <stop offset="100%" stop-color="#201C16" />
    </linearGradient>
    <linearGradient id="goldRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#C5A059" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="1160" height="340" rx="10" fill="none" stroke="#2A2A2A" stroke-width="1.5" />

  <!-- Subtle editorial corner ornament -->
  <path d="M 1030 56 L 1140 56 L 1140 166" fill="none" stroke="#C5A059" stroke-opacity="0.35" stroke-width="1.5" />
  <circle cx="1116" cy="80" r="4" fill="#C5A059" fill-opacity="0.85" />

  <!-- Domain eyebrow badge -->
  <rect x="64" y="56" width="290" height="36" rx="18" fill="#1F1D19" stroke="#C5A059" stroke-opacity="0.55" stroke-width="1" />
  <circle cx="86" cy="74" r="5" fill="#C5A059" />
  <text x="102" y="81" fill="#C5A059" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" letter-spacing="1.2">CERNAPENSAMENTO.ORG</text>

  <!-- Main Masthead -->
  <text x="64" y="160" fill="#FBF9F8" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="700" letter-spacing="1.5">CERNA PENSAMENTO</text>

  <!-- Gold hairline rule -->
  <rect x="64" y="182" width="760" height="2" fill="url(#goldRule)" />

  <!-- Subtitle -->
  <text x="64" y="224" fill="#E4E2E2" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-style="italic">Revista dixital de pensamento, filosofía política, economía austríaca e creación literaria</text>
  <text x="64" y="256" fill="#9E9689" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19">Plataforma editorial bilingüe (GL / ES) con editor TipTap 3, traducción Gemini, PDF y newsletter automatizada</text>

  <!-- Stack Pills (Y=290..332, plenty of padding from Y=380 edge) -->
  <rect x="64" y="290" width="150" height="38" rx="8" fill="#1F1E1C" stroke="#363430" stroke-width="1" />
  <text x="139" y="315" text-anchor="middle" fill="#FBF9F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600">Next.js 16</text>

  <rect x="228" y="290" width="142" height="38" rx="8" fill="#1F1E1C" stroke="#363430" stroke-width="1" />
  <text x="299" y="315" text-anchor="middle" fill="#FBF9F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600">React 19</text>

  <rect x="384" y="290" width="190" height="38" rx="8" fill="#1F1E1C" stroke="#363430" stroke-width="1" />
  <text x="479" y="315" text-anchor="middle" fill="#FBF9F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600">Supabase + RLS</text>

  <rect x="588" y="290" width="150" height="38" rx="8" fill="#1F1E1C" stroke="#363430" stroke-width="1" />
  <text x="663" y="315" text-anchor="middle" fill="#FBF9F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600">TipTap 3.27</text>

  <rect x="752" y="290" width="166" height="38" rx="8" fill="#1F1E1C" stroke="#363430" stroke-width="1" />
  <text x="835" y="315" text-anchor="middle" fill="#FBF9F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600">Tailwind CSS v4</text>

  <rect x="932" y="290" width="128" height="38" rx="8" fill="#262015" stroke="#C5A059" stroke-opacity="0.7" stroke-width="1" />
  <text x="996" y="315" text-anchor="middle" fill="#C5A059" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">GL / ES</text>
</svg>
