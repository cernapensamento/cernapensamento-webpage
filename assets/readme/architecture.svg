<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Cerna Pensamento — System Architecture Overview</title>
  <desc id="arch-desc">Four-tier diagram connecting Reader and TipTap Editor, Edge Middleware with Upstash Redis, Next.js 16 Server Actions and APIs, and Supabase PostgreSQL, Auth, Cron, and Storage.</desc>
  <defs>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#C5A059" />
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#9E9689" />
    </marker>
  </defs>

  <rect width="1200" height="480" rx="16" fill="#141414" />
  <rect x="20" y="20" width="1160" height="440" rx="10" fill="none" stroke="#2A2A2A" stroke-width="1.5" />

  <!-- Top Header -->
  <text x="52" y="64" fill="#FBF9F8" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700">Flujo de Datos y Capas del Sistema</text>
  <text x="1148" y="64" text-anchor="end" fill="#C5A059" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600">GL (default) · ES · ISR 60s</text>
  <line x1="52" y1="80" x2="1148" y2="80" stroke="#2A2A2A" stroke-width="1" />

  <!-- TIER 1: Client & Editor (X: 52..276, W=224) -->
  <rect x="52" y="108" width="224" height="128" rx="10" fill="#1B1A18" stroke="#363430" stroke-width="1.5" />
  <text x="72" y="140" fill="#C5A059" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">LECTOR PÚBLICO</text>
  <text x="72" y="170" fill="#FBF9F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="600">App Router + ISR</text>
  <text x="72" y="200" fill="#9E9689" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">KaTeX · TOC · Sanitizado</text>
  <text x="72" y="224" fill="#9E9689" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">PDF · AI Markdown</text>

  <rect x="52" y="264" width="224" height="128" rx="10" fill="#1B1A18" stroke="#363430" stroke-width="1.5" />
  <text x="72" y="296" fill="#C5A059" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">ESCRITORIO</text>
  <text x="72" y="326" fill="#FBF9F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="600">Editor TipTap 3</text>
  <text x="72" y="356" fill="#9E9689" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Math · Tablas · Figuras</text>
  <text x="72" y="380" fill="#9E9689" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Compresión WebP</text>

  <!-- Connectors Col 1 -> Col 2 -->
  <line x1="276" y1="172" x2="326" y2="210" stroke="#C5A059" stroke-width="2" marker-end="url(#arrowGold)" />
  <line x1="276" y1="328" x2="326" y2="255" stroke="#9E9689" stroke-width="2" marker-end="url(#arrowMuted)" />

  <!-- TIER 2: Edge Middleware + Upstash (X: 332..560, W=228) -->
  <rect x="332" y="136" width="228" height="168" rx="10" fill="#1F1D18" stroke="#C5A059" stroke-opacity="0.7" stroke-width="1.5" />
  <text x="352" y="168" fill="#C5A059" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">EDGE PERIMETER</text>
  <text x="352" y="198" fill="#FBF9F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="600">src/proxy.ts</text>
  <text x="352" y="228" fill="#E4E2E2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Detección GL / ES</text>
  <text x="352" y="254" fill="#E4E2E2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Auth Gate &amp; Aliases</text>
  <text x="352" y="280" fill="#9E9689" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Bypass llms.txt + MD</text>

  <line x1="446" y1="304" x2="446" y2="338" stroke="#C5A059" stroke-width="2" marker-end="url(#arrowGold)" />

  <rect x="332" y="344" width="228" height="86" rx="10" fill="#1B1A18" stroke="#363430" stroke-width="1.5" />
  <text x="352" y="376" fill="#C5A059" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">UPSTASH REDIS</text>
  <text x="352" y="408" fill="#E4E2E2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">10/m API · 30/m Mutac.</text>

  <!-- Connectors Col 2 -> Col 3 -->
  <line x1="560" y1="186" x2="614" y2="164" stroke="#9E9689" stroke-width="2" marker-end="url(#arrowMuted)" />
  <line x1="560" y1="242" x2="614" y2="274" stroke="#C5A059" stroke-width="2" marker-end="url(#arrowGold)" />

  <!-- TIER 3: Backend Next.js & External APIs (X: 620..864, W=244) -->
  <rect x="620" y="108" width="244" height="114" rx="10" fill="#1B1A18" stroke="#363430" stroke-width="1.5" />
  <text x="640" y="138" fill="#C5A059" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">SERVER ACTIONS</text>
  <text x="640" y="168" fill="#FBF9F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="600">Ciclo Editorial</text>
  <text x="640" y="198" fill="#9E9689" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Draft → Review → Pub.</text>

  <rect x="620" y="236" width="244" height="114" rx="10" fill="#1B1A18" stroke="#363430" stroke-width="1.5" />
  <text x="640" y="266" fill="#C5A059" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">ROUTE HANDLERS</text>
  <text x="640" y="296" fill="#FBF9F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="600">/api/* y Sentry</text>
  <text x="640" y="326" fill="#9E9689" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">PDF · Markdown · Auth</text>

  <rect x="620" y="364" width="244" height="72" rx="10" fill="#1B1A18" stroke="#363430" stroke-width="1.5" />
  <text x="640" y="395" fill="#FBF9F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="600">Gemini 3.5 &amp; Resend</text>
  <text x="640" y="422" fill="#9E9689" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Traducción + Newsletter</text>

  <!-- Connectors Col 3 -> Col 4 -->
  <line x1="864" y1="164" x2="914" y2="164" stroke="#9E9689" stroke-width="2" marker-end="url(#arrowMuted)" />
  <line x1="864" y1="292" x2="914" y2="292" stroke="#C5A059" stroke-width="2" marker-end="url(#arrowGold)" />

  <!-- TIER 4: Supabase Platform (X: 920..1148, W=228) -->
  <rect x="920" y="108" width="228" height="104" rx="10" fill="#1B1A18" stroke="#363430" stroke-width="1.5" />
  <text x="940" y="138" fill="#C5A059" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">GOTRUE + VAULT</text>
  <text x="940" y="168" fill="#FBF9F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="600">Auth &amp; JWT Roles</text>
  <text x="940" y="196" fill="#9E9689" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Google OAuth · Reader..Admin</text>

  <rect x="920" y="226" width="228" height="114" rx="10" fill="#1F1D18" stroke="#C5A059" stroke-opacity="0.7" stroke-width="1.5" />
  <text x="940" y="256" fill="#C5A059" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">POSTGRESQL + RLS</text>
  <text x="940" y="286" fill="#FBF9F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="600">DAL Tipado + Cron</text>
  <text x="940" y="316" fill="#9E9689" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">pg_net · Reconciliación</text>

  <rect x="920" y="354" width="228" height="82" rx="10" fill="#1B1A18" stroke="#363430" stroke-width="1.5" />
  <text x="940" y="385" fill="#C5A059" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">STORAGE BUCKET</text>
  <text x="940" y="416" fill="#E4E2E2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">media · WebP · Cleanup</text>
</svg>
