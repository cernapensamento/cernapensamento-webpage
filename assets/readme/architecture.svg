<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Cerna Pensamento — Arquitectura do Sistema</title>
  <desc id="arch-desc">Sharp editorial print-style diagram of Cerna Pensamento layers: Reader and TipTap 3 Desk, Edge Proxy and Upstash Redis, Next.js 16 Server Actions and Route Handlers, and Supabase PostgreSQL, Auth, Cron, and WebP Storage.</desc>
